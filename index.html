<!DOCTYPE html>
<html lang="es">

        #cartBar{padding-bottom:calc(1rem + env(safe-area-inset-bottom,0px))}
        #checkoutModal>div{max-height:92vh;overflow-y:auto}

<body class="bg-gray-50 text-gray-800 font-sans pb-36">

    <!-- Header / Banner -->
    <header class="bg-zinc-900 text-white shadow-md sm:sticky sm:top-0 z-40">
        <div class="max-w-4xl mx-auto px-4 py-3 sm:py-4 flex flex-col sm:flex-row justify-between items-center gap-3 sm:gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-red-700 p-2 rounded-xl text-white font-bold text-xl">
                    <i class="fa-solid fa-fire"></i>
                </div>
                <div>
                    <h1 class="text-xl font-black tracking-wider">CARNES GUERRA</h1>
                    <p class="text-[11px] sm:text-xs text-red-400 font-medium">Carne de primera calidad y Mini Market</p>
                </div>
            </div>

            <!-- Selector de Sucursales -->
            <div class="flex items-center space-x-2 bg-zinc-800 p-1.5 rounded-lg border border-zinc-700 w-full sm:w-auto">
                <span class="text-xs text-gray-400 px-2 font-medium"><i class="fa-solid fa-store mr-1"></i> Retira en:</span>
                <select id="branchSelect" class="min-w-0 flex-1 bg-zinc-900 text-white text-xs font-bold py-2 px-2 rounded-md outline-none border border-zinc-700 focus:border-red-500 cursor-pointer"></select>
            </div>
        </div>
    </header>

    <!-- Main Content -->

        <!-- Buscador y Filtros -->
        <div class="mb-6 space-y-4">

                <input type="text" id="searchInput" placeholder="Buscar cortes, pastas, aderezos, bebidas..."

            </div>

            <!-- Contenedor con Flechas de Navegación para Categorías -->
            <div class="relative flex items-center">
                <!-- Flecha Izquierda -->
                <button type="button" onclick="scrollCat(-220)" aria-label="Desplazar categorías a la izquierda"

                    <i class="fa-solid fa-chevron-left text-xs"></i>
                </button>

                <!-- Barra deslizable horizontal -->
                <div id="catScrollContainer" class="flex gap-2 overflow-x-auto pb-2 scrollbar-none px-1 w-full scroll-smooth">
                    <button onclick="filterCategory('todos', this)" class="cat-btn flex-shrink-0 bg-zinc-900 text-white text-xs font-bold px-4 py-2.5 rounded-full whitespace-nowrap shadow-sm transition-all">Todos</button>
                    <button onclick="filterCategory('Ofertas', this)" class="cat-btn flex-shrink-0 bg-red-600 text-white font-bold text-xs px-4 py-2.5 rounded-full whitespace-nowrap shadow-sm hover:bg-red-700 transition-all">🔥 Ofertas</button>
                    <button onclick="filterCategory('Promos', this)" class="cat-btn flex-shrink-0 bg-amber-600 text-white font-bold text-xs px-4 py-2.5 rounded-full whitespace-nowrap shadow-sm hover:bg-amber-700 transition-all">⭐ Promos</button>
                    <button onclick="filterCategory('Vacunos', this)" class="cat-btn flex-shrink-0 bg-white text-gray-700 border border-gray-200 text-xs font-semibold px-4 py-2.5 rounded-full whitespace-nowrap shadow-sm hover:bg-gray-100 transition-all">🥩 Vacunos</button>
                    <button onclick="filterCategory('Cerdo', this)" class="cat-btn flex-shrink-0 bg-white text-gray-700 border border-gray-200 text-xs font-semibold px-4 py-2.5 rounded-full whitespace-nowrap shadow-sm hover:bg-gray-100 transition-all">🐖 Cerdo</button>
                    <button onclick="filterCategory('Pollo', this)" class="cat-btn flex-shrink-0 bg-white text-gray-700 border border-gray-200 text-xs font-semibold px-4 py-2.5 rounded-full whitespace-nowrap shadow-sm hover:bg-gray-100 transition-all">🍗 Pollo</button>
                    <button onclick="filterCategory('Achuras', this)" class="cat-btn flex-shrink-0 bg-white text-gray-700 border border-gray-200 text-xs font-semibold px-4 py-2.5 rounded-full whitespace-nowrap shadow-sm hover:bg-gray-100 transition-all">🔥 Achuras</button>
                    <button onclick="filterCategory('Fiambres', this)" class="cat-btn flex-shrink-0 bg-white text-gray-700 border border-gray-200 text-xs font-semibold px-4 py-2.5 rounded-full whitespace-nowrap shadow-sm hover:bg-gray-100 transition-all">🧀 Fiambres</button>

        </div>

        <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <!-- Inyectado por JS -->
        </div>
    </main>

    <!-- Carrito Flotante / Footer Bar -->
    <div id="cartBar" class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-2xl p-4 transform translate-y-full transition-transform duration-300 z-50">
        <div class="max-w-4xl mx-auto flex items-center justify-between gap-3">
            <div>
                <p class="text-xs text-gray-500 font-medium">Tu pedido (<span id="cartCount">0</span> productos)</p>
                <p id="cartTotalBar" class="text-lg font-black text-zinc-900">$0</p>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="clearCart()" title="Vaciar carrito" class="bg-red-50 hover:bg-red-100 text-red-600 font-bold p-3 rounded-xl text-sm transition-colors">
                    <i class="fa-solid fa-trash-can"></i>
                </button>

                    <span>Ver y Enviar<span class="hidden sm:inline"> por WhatsApp</span></span>
                </button>
            </div>
        </div>
    </div>

    <!-- Modal Checkout -->

        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b pb-3">

            </div>

            <div class="flex justify-between items-center bg-gray-50 p-3 rounded-xl border border-gray-200">
                <span class="text-xs font-bold text-gray-600 uppercase">Total del Pedido:</span>
                <span id="modalTotal" class="text-base font-black text-red-600">$0</span>

            </div>

            { id: 109, categoria: "Almacen", producto: "Maiz Pisado Blanco Marolio (400g)", unidad: "paquete", precio: 2300 },
            { id: 110, categoria: "Almacen", producto: "Maicena La Original (500g)", unidad: "paquete", precio: 4500 },
            { id: 111, categoria: "Almacen", producto: "Yerba Mate Probell (500g)", unidad: "paquete", precio: 1200 },
            { id: 112, categoria: "Almacen", producto: "Yerba Mate Rosamonte (500g)", unidad: "paquete", precio: 2800 },
            { id: 113, categoria: "Almacen", producto: "Yerba Mate Suave Rosamonte (500g)", unidad: "paquete", precio: 2800 },
            { id: 150, categoria: "Limpieza", producto: "Servilletas Cocina Sol Mayor (3 rollos)", unidad: "paquete", precio: 1300 },
            { id: 151, categoria: "Limpieza", producto: "Papel Higienico Campanita (4 rollos)", unidad: "paquete", precio: 1300 },
            { id: 152, categoria: "Limpieza", producto: "Shampoo Sedal Sobre (10ml)", unidad: "sobre", precio: 300 },
            { id: 153, categoria: "Limpieza", producto: "Acondicionador Sedal Sobre (10ml)", unidad: "sobre", precio: 300 },
            { id: 154, categoria: "Limpieza", producto: "Maquina Afeitar Gillette (2 hojas)", unidad: "unidad", precio: 1300 },
            { id: 160, categoria: "Leña", producto: "Atado de Leña", unidad: "unidad", precio: 2000 },
            { id: 161, categoria: "Leña", producto: "Promo 3 Atados de Leña", unidad: "promo", precio: 5000 }
        ];

        let cart = {};
        let draftQty = {};
        let currentFilter = 'todos';

        const isGramsItem = p => (p.unidad || '').toLowerCase().trim() === '100g';
        const isKgItem = p => (p.unidad || '').toLowerCase().trim() === 'kg';

        const stepOf = p => {
            if (isGramsItem(p)) return 100;
            if (isKgItem(p)) return 0.5;
            return 1;
        };

        const fmt = n => Number.isInteger(n) ? String(n) : n.toFixed(1);
        const money = n => '$' + Math.round(Number(n)).toLocaleString('es-AR');

        document.getElementById('branchSelect').innerHTML =
            BRANCHES.map(b => `<option value="${b.id}">${b.name}</option>`).join('');

        function scrollCat(amount) {
            const container = document.getElementById('catScrollContainer');
            if (container) {
                container.scrollBy({ left: amount, behavior: 'smooth' });
            }
        }

        function normalizeRow(item) {
            let { id, categoria, producto, unidad, precio } = item;
            const pLow = producto.toLowerCase();
            const uLow = unidad.toLowerCase().trim();

            if (pLow.includes('manteca')) categoria = 'Lacteos';
            else if (pLow.includes('ravioles') || pLow.includes('fideos')) categoria = 'Pastas';
            else if (pLow.includes('salchicha') || pLow.includes('proveleta') || pLow.includes('provoleta') || categoria.toLowerCase() === 'fresco') categoria = 'Frescos';
            else if (pLow.includes('mayonesa') || pLow.includes('ketchup') || pLow.includes('mostaza') || pLow.includes('salsa') || pLow.includes('sal de campo') || pLow.includes('alicante')) categoria = 'Aderezos';

            const isRealFiambre = categoria.toLowerCase() === 'fiambres' && uLow === '100g';
            if (!isRealFiambre && uLow !== 'kg' && uLow !== 'unidad' && uLow !== 'paquete' && uLow !== 'caja' && uLow !== 'lata' && uLow !== 'sobre' && uLow !== 'maple' && uLow !== 'oferta' && uLow !== 'combo' && uLow !== 'promo') {
                if (!producto.includes('(')) {
                    producto = `${producto} (${unidad})`;
                }
                unidad = 'paquete';
            }

            return { id, categoria, producto, unidad, precio };
        }

        function parseCSV(text) {
            const rows = []; let row = [], cur = '', q = false;
            for (let i = 0; i < text.length; i++) {
                const c = text[i];
                if (q) { if (c === '"' && text[i+1] === '"') { cur += '"'; i++; } else if (c === '"') q = false; else cur += c; }
                else if (c === '"') q = true;
                else if (c === ',') { row.push(cur); cur = ''; }
                else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
                else if (c !== '\r') cur += c;
            }
            if (cur || row.length) { row.push(cur); rows.push(row); }
            return rows;
        }

        async function loadSheet() {
            if (!SHEET_CSV_URL) return;
            try {
                const res = await fetch(SHEET_CSV_URL, { cache: "no-store" });
                if (!res.ok) throw new Error("HTTP " + res.status);
                const text = await res.text();
                const rows = parseCSV(text);
                if (!rows.length) return;

                const head = rows.shift().map(h => h.replace(/^[\uFEFF\s]+|[\s]+$/g, '').toLowerCase());
                const ix = k => head.indexOf(k);
                
                const seenIds = new Set();
                const list = rows.filter(r => r[ix('producto')] && r[ix('producto')].trim() !== '').map((r, n) => {
                    let rawPrice = r[ix('precio')] ? r[ix('precio')].toString().trim() : '0';
                    let cleanPrice = parseFloat(rawPrice.replace(/[^0-9.,]/g, '').replace(/\./g, '').replace(',', '.')) || 0;
                    
                    let id = parseInt(r[ix('id')]) || (1000 + n);
                    while (seenIds.has(id)) { id += 1000; }
                    seenIds.add(id);

                    return normalizeRow({
                        id: id,
                        categoria: (r[ix('categoria')] || '').trim(),
                        producto: r[ix('producto')].trim(),
                        unidad: (r[ix('unidad')] || 'unidad').trim(),
                        precio: cleanPrice
                    });
                });

                if (list.length > 0) { 
                    products = list; 
                    renderProducts(currentFilter, document.getElementById('searchInput').value); 
                    updateCartBar();
                }
            } catch (e) { 
                console.warn('Usando lista local de respaldo:', e); 
            }
        }

        function calcSubtotal(prod, qty) {
            if (!prod || prod.precio <= 0) return 0;
            if (isGramsItem(prod)) {
                return (prod.precio / 100) * qty;
            }
            return prod.precio * qty;
        }

        function formatQtyLabel(prod, qty) {
            if (isGramsItem(prod)) return `${qty}g`;
            if (isKgItem(prod)) return `${fmt(qty)} kg`;
            return `${fmt(qty)}`;
        }

        function formatWhatsAppQty(prod, qty) {
            if (isGramsItem(prod)) return `${qty}g`;
            if (isKgItem(prod)) return `${fmt(qty)} kg`;
            const u = prod.unidad.toLowerCase();
            if (qty === 1) return `1 ${u}`;
            if (u === 'unidad') return `${qty} unidades`;
            return `${qty} ${u}s`;
        }

        function renderProducts(filter = 'todos', search = '') {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';

            const filtered = products.filter(p => {
                const matchesCat = filter === 'todos' || p.categoria.toLowerCase() === filter.toLowerCase();
                const matchesSearch = p.producto.toLowerCase().includes(search.toLowerCase()) || p.categoria.toLowerCase().includes(search.toLowerCase());
                return matchesCat && matchesSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="sm:col-span-2 text-center py-12 text-gray-400 text-sm">No se encontraron productos en esta sección.</div>`;
                return;
            }

            filtered.forEach(p => {
                const inCart = cart[p.id] !== undefined;
                const defaultQty = stepOf(p);
                const qty = inCart ? cart[p.id] : (draftQty[p.id] || defaultQty);
                const priceText = p.precio > 0 ? money(p.precio) : 'Consultar';
                
                let badgeColor = "bg-gray-100 text-gray-600";
                if(p.categoria === 'Ofertas') badgeColor = "bg-red-100 text-red-700 font-bold";
                if(p.categoria === 'Promos') badgeColor = "bg-amber-100 text-amber-700 font-bold";

                const selectorHTML = isGramsItem(p) ? `
                    <div class="flex items-center space-x-1">
                        <button onclick="updateQty(${p.id}, -1)" class="w-8 h-9 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg font-bold text-base flex items-center justify-center">-</button>
                        <div class="relative flex items-center">
                            <input type="number" step="50" min="50" value="${qty}" 
                                onchange="setCustomGrams(${p.id}, this.value)"
                                class="w-16 h-9 bg-gray-50 border border-gray-200 rounded-lg text-center font-bold text-xs pr-3 focus:outline-none focus:ring-1 focus:ring-red-500"
                                title="Escribí los gramos que quieras">
                            <span class="absolute right-1.5 text-[10px] text-gray-400 font-bold pointer-events-none">g</span>
                        </div>
                        <button onclick="updateQty(${p.id}, 1)" class="w-8 h-9 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg font-bold text-base flex items-center justify-center">+</button>
                    </div>
                ` : `
                    <div class="flex items-center space-x-1.5">
                        <button onclick="updateQty(${p.id}, -1)" class="w-9 h-9 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg font-bold text-base flex items-center justify-center">-</button>
                        <span id="qty-${p.id}" class="text-xs font-bold min-w-[2.5rem] px-1 text-center">${formatQtyLabel(p, qty)}</span>
                        <button onclick="updateQty(${p.id}, 1)" class="w-9 h-9 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg font-bold text-base flex items-center justify-center">+</button>
                    </div>
                `;

                const card = document.createElement('div');
                card.className = `bg-white p-4 rounded-2xl border ${inCart ? 'border-emerald-500 ring-1 ring-emerald-500' : 'border-gray-100'} shadow-sm flex flex-col justify-between hover:shadow-md transition-all`;
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-1">
                            <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 ${badgeColor} rounded-md">${p.categoria}</span>
                            <span class="text-xs font-bold text-red-600">${priceText} <span class="text-[10px] text-gray-400 font-normal">/ ${p.unidad}</span></span>
                        </div>
                        <h4 class="font-bold text-gray-800 text-sm mb-3 leading-snug">${p.producto}</h4>
                    </div>
                    <div class="flex items-center justify-between pt-2 border-t border-gray-50 gap-2">
                        ${selectorHTML}
                        <div class="flex items-center gap-1.5">
                            ${inCart ? `
                                <button onclick="removeFromCart(${p.id})" title="Quitar del pedido" class="bg-red-50 hover:bg-red-100 text-red-600 text-xs font-bold px-3 py-2.5 rounded-xl transition-colors">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                                <button onclick="addToCart(${p.id})" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3 py-2.5 rounded-xl transition-colors">
                                    <i class="fa-solid fa-check mr-1"></i> En pedido
                                </button>
                            ` : `
                                <button onclick="addToCart(${p.id})" class="bg-zinc-900 hover:bg-red-600 text-white text-xs font-bold px-3 py-2.5 rounded-xl transition-colors">
                                    <i class="fa-solid fa-cart-plus mr-1"></i> Agregar
                                </button>
                            `}
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function setCustomGrams(id, val) {
            const p = products.find(x => x.id === id);
            if (!p) return;
            let grams = parseInt(val, 10);
            if (isNaN(grams) || grams <= 0) {
                if (cart[id] !== undefined) removeFromCart(id);
                return;
            }
            draftQty[id] = grams;
            if (cart[id] !== undefined) {
                cart[id] = grams;
                updateCartBar();
            }
            renderProducts(currentFilter, document.getElementById('searchInput').value);
        }

        function updateQty(id, delta) {
            const p = products.find(x => x.id === id);
            if(!p) return;
            const s = stepOf(p);
            
            let current = cart[id] !== undefined ? cart[id] : (draftQty[id] || s);
            current = Math.round((current + delta * s) * 10) / 10;

            if (current <= 0) {
                delete draftQty[id];
                if (cart[id] !== undefined) removeFromCart(id);
                return;
            }

            draftQty[id] = current;
            if (cart[id] !== undefined) {
                cart[id] = current;
                updateCartBar();
            }
            renderProducts(currentFilter, document.getElementById('searchInput').value);
        }

        function addToCart(id) {
            const p = products.find(x => x.id === id);
            if (!p) return;
            const qty = draftQty[id] !== undefined ? draftQty[id] : (cart[id] !== undefined ? cart[id] : stepOf(p));
            cart[id] = qty;
            updateCartBar();
            renderProducts(currentFilter, document.getElementById('searchInput').value);
        }

        function removeFromCart(id) {
            delete cart[id];
            delete draftQty[id];
            updateCartBar();
            renderProducts(currentFilter, document.getElementById('searchInput').value);
            if (!document.getElementById('checkoutModal').classList.contains('hidden')) {
                renderCheckoutList();
                if (Object.keys(cart).length === 0) closeCheckout();
            }
        }

        function clearCart() {
            cart = {};
            draftQty = {};
            updateCartBar();
            renderProducts(currentFilter, document.getElementById('searchInput').value);
            closeCheckout();
        }

        function getCartTotal() {
            let total = 0;
            for (let id in cart) {
                const prod = products.find(p => p.id == parseInt(id));
                if (prod) {
                    total += calcSubtotal(prod, cart[id]);
                }
            }
            return total;
        }

        function updateCartBar() {
            const totalItems = Object.keys(cart).length;
            const cartBar = document.getElementById('cartBar');
            document.getElementById('cartCount').innerText = totalItems;
            const totalMoney = getCartTotal();
            document.getElementById('cartTotalBar').innerText = totalMoney > 0 ? money(totalMoney) : 'A confirmar';

            if (totalItems > 0) {
                cartBar.classList.remove('translate-y-full');
            } else {
                cartBar.classList.add('translate-y-full');
            }
        }

        function renderCheckoutList() {
            const container = document.getElementById('cartItemsList');
            container.innerHTML = '';
            for (let id in cart) {
                const prod = products.find(p => p.id == parseInt(id));
                if (!prod) continue;
                const qty = cart[id];
                const subVal = calcSubtotal(prod, qty);
                const sub = subVal > 0 ? money(subVal) : 'Consultar';
                const qtyText = formatWhatsAppQty(prod, qty);

                const itemDiv = document.createElement('div');
                itemDiv.className = "py-2.5 flex justify-between items-center gap-2 text-xs";
                itemDiv.innerHTML = `
                    <div class="flex-1">
                        <p class="font-bold text-gray-800">${prod.producto}</p>
                        <p class="text-gray-500">Cantidad: ${qtyText}</p>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="font-bold text-gray-900">${sub}</span>
                        <button onclick="removeFromCart(${prod.id})" title="Eliminar ítem" class="text-red-500 hover:text-red-700 p-1.5 bg-red-50 rounded-lg">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                `;
                container.appendChild(itemDiv);
            }
            const totalMoney = getCartTotal();
            document.getElementById('modalTotal').innerText = totalMoney > 0 ? money(totalMoney) : 'A confirmar';
        }

        function filterCategory(cat, btn) {
            btn = btn || event.target;
            currentFilter = cat;
            document.querySelectorAll('.cat-btn').forEach(b => {
                b.classList.remove('bg-zinc-900', 'text-white', 'bg-red-600', 'bg-amber-600');
                b.classList.add('bg-white', 'text-gray-700', 'border', 'border-gray-200');
            });
            btn.classList.remove('bg-white', 'text-gray-700', 'border', 'border-gray-200');
            if(cat === 'Ofertas') btn.classList.add('bg-red-600', 'text-white');
            else if(cat === 'Promos') btn.classList.add('bg-amber-600', 'text-white');
            else btn.classList.add('bg-zinc-900', 'text-white');
            
            const search = document.getElementById('searchInput').value;
            renderProducts(currentFilter, search);
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            renderProducts(currentFilter, e.target.value);
        });

        function openCheckout() {
            renderCheckoutList();
            document.getElementById('checkoutModal').classList.remove('hidden');
            document.getElementById('checkoutModal').classList.add('flex');
        }

        function closeCheckout() {
            document.getElementById('checkoutModal').classList.remove('flex');
            document.getElementById('checkoutModal').classList.add('hidden');
        }

        function sendToWhatsApp() {
            const name = document.getElementById('clientName').value.trim();
            const note = document.getElementById('clientNote').value.trim();
            const branchSelect = document.getElementById('branchSelect');
            const branchName = branchSelect.options[branchSelect.selectedIndex].text;
            
            if(!name) {
                alert('Por favor ingresa tu nombre para enviar el pedido.');
                return;
            }

            let message = `*Nuevo Pedido - Carnes Guerra*\n\n`;
            message += `*Cliente:* ${name}\n`;
            message += `*Retira en:* ${branchName}\n`;
            if(note) message += `*Nota:* ${note}\n`;
            message += `----------------------------------\n`;

            let totalEst = 0;
            for(let id in cart) {
                const prod = products.find(p => p.id == parseInt(id));
                if(!prod) continue;
                const qty = cart[id];
                const subtotal = calcSubtotal(prod, qty);
                totalEst += subtotal;

                const displayQtyText = formatWhatsAppQty(prod, qty);

                if (subtotal > 0) {
                    message += `- *${prod.producto}* (${displayQtyText}) - ${money(subtotal)}\n`;
                } else {
                    message += `- *${prod.producto}* (${displayQtyText})\n`;
                }
            }

            message += `----------------------------------\n`;
            if(totalEst > 0) {
                message += `*Total del Pedido:* ${money(totalEst)}\n`;
            }

            const phone = BRANCHES.find(b => b.id === branchSelect.value).phone;
            const url = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
            window.open(url, '_blank');
        }

        renderProducts();
        loadSheet();
    </script>
</body>
