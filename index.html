<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carnes Guerra | Catálogo Online & Pedidos</title>
    <meta name="theme-color" content="#18181b">
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <style>
        html { -webkit-text-size-adjust: 100%; }
        input, select, textarea { font-size: 16px !important; }
        #cartBar { padding-bottom: calc(1rem + env(safe-area-inset-bottom, 0px)); }
        #checkoutModal > div { max-height: 92vh; overflow-y: auto; }
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { appearance: textfield; -moz-appearance: textfield; }
        
        /* Ocultar barra de scroll para navegación táctil limpia */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { scrollbar-width: none; -webkit-overflow-scrolling: touch; }
    </style>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-800 font-sans pb-36 relative min-h-screen">

    <!-- Marca de agua de fondo de Carnes Guerra -->
    <div class="fixed inset-0 pointer-events-none z-0 flex items-center justify-center opacity-[0.14] select-none overflow-hidden">
        <img src="Logo-carnesguerra.jpeg" alt="Carnes Guerra Fondo" class="w-[88vw] max-w-xl object-contain">
    </div>

    <!-- Header / Banner -->
    <header class="bg-zinc-900 text-white shadow-md sm:sticky sm:top-0 z-40 relative">
        <div class="max-w-4xl mx-auto px-4 py-3 sm:py-4 flex flex-col sm:flex-row justify-between items-center gap-3">
            <div class="flex items-center space-x-3 w-full sm:w-auto justify-between sm:justify-start">
                <div class="flex items-center space-x-3">
                    <img src="Logo-carnesguerra.jpeg" alt="Logo Carnes Guerra" class="w-11 h-11 rounded-xl object-contain bg-white p-0.5 shadow-sm">
                    <div>
                        <h1 class="text-xl font-black tracking-wider leading-none">CARNES GUERRA</h1>
                        <p class="text-[11px] text-gray-300 font-medium mt-1">
                            <i class="fa-solid fa-location-dot text-red-500 mr-1"></i>Dr. Ortega Oeste 1340 (Entre Rivadavia y Magallanes)
                        </p>
                    </div>
                </div>
            </div>

            <!-- Selector de Modalidad: Retiro vs Delivery -->
            <div class="grid grid-cols-2 bg-zinc-800 p-1 rounded-xl border border-zinc-700 w-full sm:w-auto gap-1">
                <button type="button" id="btnModeRetiro" onclick="setDeliveryMode('retiro')" 
                    class="px-3 py-2 rounded-lg text-xs font-bold flex items-center justify-center gap-1.5 transition-all bg-red-600 text-white shadow">
                    <i class="fa-solid fa-store"></i>
                    <span>Retiro en Local</span>
                </button>
                <button type="button" id="btnModeDelivery" onclick="setDeliveryMode('delivery')" 
                    class="px-3 py-2 rounded-lg text-xs font-bold flex items-center justify-center gap-1.5 transition-all text-gray-300 hover:text-white">
                    <i class="fa-solid fa-motorcycle"></i>
                    <span>Delivery / Envío</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 py-5 relative z-10">

        <!-- Buscador y Categorías -->
        <div class="mb-6 space-y-3">
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-gray-400"></i>
                <input type="text" id="searchInput" placeholder="Buscar cortes, cervezas, gaseosas, almacén (ej: cuadril, ortuzar, fanta)..." 
                    class="w-full bg-white/95 pl-11 pr-10 py-3 rounded-xl border border-gray-200 shadow-sm focus:outline-none focus:ring-2 focus:ring-red-500 text-sm">
                <button id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute right-3.5 top-3 text-gray-400 hover:text-gray-700 font-bold text-lg leading-none">&times;</button>
            </div>

            <!-- Barra de Categorías con flechas < > -->
            <div class="relative flex items-center gap-1">
                <button onclick="scrollCategories(-200)" aria-label="Anterior" 
                    class="flex z-10 w-8 h-8 items-center justify-center bg-white shadow-md border border-gray-200 rounded-full text-zinc-800 active:scale-90 hover:bg-gray-100 shrink-0 transition">
                    <i class="fa-solid fa-chevron-left text-xs"></i>
                </button>

                <div id="catContainer" class="flex overflow-x-auto hide-scrollbar gap-2 py-1.5 scroll-smooth w-full px-1">
                    <button onclick="filterCategory('todos', this)" data-cat="todos" class="cat-btn shrink-0 whitespace-nowrap text-xs px-3.5 py-2 rounded-full transition-all">Todos</button>
                    <button onclick="filterCategory('Ofertas', this)" data-cat="Ofertas" class="cat-btn shrink-0 whitespace-nowrap text-xs px-3.5 py-2 rounded-full transition-all">🔥 Ofertas</button>
                    <button onclick="filterCategory('Promos', this)" data-cat="Promos" class="cat-btn shrink-0 whitespace-nowrap text-xs px-3.5 py-2 rounded-full transition-all">⭐ Promos</button>
                    <button onclick="filterCategory('Vacunos', this)" data-cat="Vacunos" class="cat-btn shrink-0 whitespace-nowrap text-xs px-3.5 py-2 rounded-full transition-all">🥩 Vacunos</button>
                    <button onclick="filterCategory('Cerdo', this)" data-cat="Cerdo" class="cat-btn shrink-0 whitespace-nowrap text-xs px-3.5 py-2 rounded-full transition-all">🐖 Cerdo</button>
                    <button onclick="filterCategory('Pollo', this)" data-cat="Pollo" class="cat-btn shrink-0 whitespace-nowrap text-xs px-3.5 py-2 rounded-full transition-all">🍗 Pollo</button>
                    <button onclick="filterCategory('Achuras', this)" data-cat="Achuras" class="cat-btn shrink-0 whitespace-nowrap text-xs px-3.5 py-2 rounded-full transition-all">🔥 Achuras</button>
                    <button onclick="filterCategory('Fiambres', this)" data-cat="Fiambres" class="cat-btn shrink-0 whitespace-nowrap text-xs px-3.5 py-2 rounded-full transition-all">🧀 Fiambres</button>
                    <button onclick="filterCategory('Frescos', this)" data-cat="Frescos" class="cat-btn shrink-0 whitespace-nowrap text-xs px-3.5 py-2 rounded-full transition-all">🥚 Frescos y Huevos</button>
                    <button onclick="filterCategory('Lacteos', this)" data-cat="Lacteos" class="cat-btn shrink-0 whitespace-nowrap text-xs px-3.5 py-2 rounded-full transition-all">🥛 Lácteos</button>
                    <button onclick="filterCategory('Pastas', this)" data-cat="Pastas" class="cat-btn shrink-0 whitespace-nowrap text-xs px-3.5 py-2 rounded-full transition-all">🍝 Pastas</button>
                    <button onclick="filterCategory('Aderezos', this)" data-cat="Aderezos" class="cat-btn shrink-0 whitespace-nowrap text-xs px-3.5 py-2 rounded-full transition-all">🥫 Condimentos y Salsas</button>
                    <button onclick="filterCategory('Almacen', this)" data-cat="Almacen" class="cat-btn shrink-0 whitespace-nowrap text-xs px-3.5 py-2 rounded-full transition-all">🛒 Almacén y Snacks</button>
                    <button onclick="filterCategory('Bebidas', this)" data-cat="Bebidas" class="cat-btn shrink-0 whitespace-nowrap text-xs px-3.5 py-2 rounded-full transition-all">🍺 Bebidas y Cervezas</button>
                    <button onclick="filterCategory('Limpieza', this)" data-cat="Limpieza" class="cat-btn shrink-0 whitespace-nowrap text-xs px-3.5 py-2 rounded-full transition-all">🧼 Limpieza</button>
                    <button onclick="filterCategory('Leña', this)" data-cat="Leña" class="cat-btn shrink-0 whitespace-nowrap text-xs px-3.5 py-2 rounded-full transition-all">🪵 Leña</button>
                </div>

                <button onclick="scrollCategories(200)" aria-label="Siguiente" 
                    class="flex z-10 w-8 h-8 items-center justify-center bg-white shadow-md border border-gray-200 rounded-full text-zinc-800 active:scale-90 hover:bg-gray-100 shrink-0 transition">
                    <i class="fa-solid fa-chevron-right text-xs"></i>
                </button>
            </div>
        </div>

        <!-- Grilla de Productos -->
        <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <!-- Inyectado por JS -->
        </div>
    </main>

    <!-- Carrito Flotante con Botón Rojo Carnicería (sin logo de WhatsApp) -->
    <div id="cartBar" class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-2xl p-4 transform translate-y-full transition-transform duration-300 z-50">
        <div class="max-w-4xl mx-auto flex items-center justify-between gap-3">
            <div>
                <p class="text-xs text-gray-500 font-medium">Tu pedido (<span id="cartCount">0</span> ítems)</p>
                <p id="cartTotalBar" class="text-lg font-black text-zinc-900">$0</p>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="clearCart()" title="Vaciar pedido" class="bg-red-50 hover:bg-red-100 text-red-600 font-bold p-3 rounded-xl text-sm transition-colors">
                    <i class="fa-solid fa-trash-can"></i>
                </button>
                <button onclick="openCheckout()" class="bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-5 rounded-xl shadow-lg flex items-center space-x-2 text-sm transition-all transform active:scale-95">
                    <i class="fa-solid fa-bag-shopping text-base"></i>
                    <span>Ver y Confirmar Pedido</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Modal Checkout -->
    <div id="checkoutModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-md w-full p-5 sm:p-6 shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="font-black text-lg text-zinc-900">Confirmar Pedido</h3>
                <button onclick="closeCheckout()" class="text-gray-400 hover:text-gray-600 font-bold text-2xl leading-none">&times;</button>
            </div>

            <div class="bg-emerald-50/80 p-3.5 rounded-xl border border-emerald-200 space-y-1.5">

                    <span class="text-xs font-bold text-gray-700 uppercase">Total Estimado:</span>
                    <span id="modalTotal" class="text-base font-black text-emerald-700">$0</span>
                </div>
                <p class="text-[11px] text-emerald-950 font-medium leading-snug">
                </p>
            </div>

            <!-- Modalidad -->

                    📍 Retirás en <strong>Dr. Ortega Oeste 1340</strong> (Entre Rivadavia y Magallanes).
                </p>
            </div>

            <!-- Datos del Cliente -->
            <div class="space-y-3">

                </div>

                <div id="deliveryAddressBox" class="hidden">
                    <label class="block text-xs font-bold text-red-700 mb-1">Dirección exacta para el Delivery: *</label>
                    <input type="text" id="clientAddress" placeholder="Ej: Calle Comandante Cabot 1540 Oeste..." class="w-full bg-red-50/40 border border-red-300 p-2.5 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-red-500">
                </div>

                <!-- Método de Pago interactivo -->
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-2">3. Método de pago:</label>
                    <div class="space-y-2">
                        <label class="payment-card flex items-center justify-between p-3 rounded-xl border-2 border-indigo-500 bg-indigo-50/30 cursor-pointer transition">
                            <div class="flex items-center space-x-3">
                                <span class="w-8 h-8 rounded-lg bg-sky-100 text-sky-600 flex items-center justify-center text-base">
                                    <i class="fa-solid fa-wallet"></i>
                                </span>
                                <div>
                                    <p class="font-bold text-xs text-gray-800">Billetera Virtual</p>
                                    <p class="text-[11px] text-gray-500">Pagás con la aplicación de Mercado Pago / Transferencia</p>
                                </div>
                            </div>
                            <input type="radio" name="paymentOption" value="Billetera Virtual (Mercado Pago)" checked class="text-indigo-600 w-4 h-4">
                        </label>

                        <label class="payment-card flex items-center justify-between p-3 rounded-xl border border-gray-200 bg-white hover:bg-gray-50 cursor-pointer transition">
                            <div class="flex items-center space-x-3">
                                <span class="w-8 h-8 rounded-lg bg-blue-100 text-blue-600 flex items-center justify-center text-base">
                                    <i class="fa-solid fa-credit-card"></i>
                                </span>
                                <div>
                                    <p class="font-bold text-xs text-gray-800">Tarjeta de Crédito / Débito</p>
                                    <p class="text-[11px] text-gray-500">Pagás con tu tarjeta de débito o crédito</p>
                                </div>
                            </div>
                            <input type="radio" name="paymentOption" value="Tarjeta de Crédito / Débito" class="text-indigo-600 w-4 h-4">
                        </label>

                        <label class="payment-card flex items-center justify-between p-3 rounded-xl border border-gray-200 bg-white hover:bg-gray-50 cursor-pointer transition">
                            <div class="flex items-center space-x-3">
                                <span class="w-8 h-8 rounded-lg bg-emerald-100 text-emerald-600 flex items-center justify-center text-base">
                                    <i class="fa-solid fa-money-bill-1-wave"></i>
                                </span>
                                <div>
                                    <p class="font-bold text-xs text-gray-800">Efectivo</p>
                                    <p class="text-[11px] text-gray-500">Pagás en efectivo al retirar o al recibir</p>
                                </div>
                            </div>
                            <input type="radio" name="paymentOption" value="Efectivo" class="text-indigo-600 w-4 h-4">
                        </label>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">4. Aclaraciones de corte o entrega (Opcional):</label>
                    <textarea id="clientNote" placeholder="Ej: Para milanesa, paso a las 19hs..." rows="2" class="w-full bg-gray-50 border border-gray-200 p-2.5 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-red-500"></textarea>
                </div>
            </div>

            <!-- Botón Final de Envío a WhatsApp -->
            <button onclick="sendToWhatsApp()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl shadow-md flex items-center justify-center space-x-2 text-sm transition-all">
                <i class="fa-brands fa-whatsapp text-lg"></i>
                <span>Enviar Pedido a WhatsApp</span>
            </button>
        </div>
    </div>

        function getCustomUnitLabel(p) {
            if (!isAnyKgItem(p)) return null;
            const name = p.producto.toLowerCase();
            if (name.includes('costeleta') || name.includes('cuadrada') || name.includes('bola de lomo') || name.includes('cuadril') || name.includes('nalga sin tapa') || name.includes('peceto')) {
                return 'Bifes';
            }
            if (name.includes('pechuga') || name.includes('suprema') || name.includes('pata muslo') || name.includes('chorizo') || name.includes('osobuco') || name.includes('riñon')) {
                return 'Unidades';
            }
            return null;
        }

        // Estimación de peso en kg por unidad o bife para totalizar el estimado
        function getEstimatedUnitWeight(prod) {
            const name = prod.producto.toLowerCase();
            if (name.includes('suprema')) return 0.28;   // ~280g c/u
            if (name.includes('pechuga')) return 0.35;   // ~350g c/u
            if (name.includes('pata muslo')) return 0.38;// ~380g c/u
            if (name.includes('bife') || name.includes('cuadril') || name.includes('nalga') || name.includes('costeleta') || name.includes('bola de lomo') || name.includes('cuadrada')) {
                return 0.22; // ~220g por bife
            }
            if (name.includes('chorizo') || name.includes('morcilla')) return 0.15;
            if (name.includes('osobuco')) return 0.35;
            if (name.includes('riñon')) return 0.20;
            return 0.25;
        }

        function getMode(p) {
            if (isAnyKgItem(p)) {
                if (getCustomUnitLabel(p) && itemSaleMode[p.id] === 'unit') return 'unit';
                return isKgWholeItem(p) ? 'kg_entero' : 'kg';
            }
            if (isGramsItem(p)) return 'grams';
            return 'pack';
        }

        const stepOf = p => {
            const mode = getMode(p);
            if (mode === 'grams') return 100;
            if (mode === 'kg') return 0.5;
            if (mode === 'kg_entero') return 1;
            return 1;
        };

        function normalizeRow(item) {
            let { id, categoria, producto, unidad, precio } = item;
            const pLow = (producto || '').toLowerCase();
            const uLow = (unidad || '').toLowerCase().trim();

            if (pLow.includes('manteca')) categoria = 'Lacteos';
            else if (pLow.includes('ravioles') || pLow.includes('fideos')) categoria = 'Pastas';
            else if ((pLow.includes('salchicha') || pLow.includes('provoleta') || (categoria || '').toLowerCase() === 'fresco') && (categoria || '').toLowerCase() !== 'ofertas') categoria = 'Frescos';
            else if ((pLow.includes('mayonesa') || pLow.includes('ketchup') || pLow.includes('mostaza') || pLow.includes('salsa') || pLow.includes('sal de campo') || pLow.includes('alicante') || pLow.includes('caldo') || pLow.includes('pimienta') || pLow.includes('pimenton')) && (categoria || '').toLowerCase() !== 'promos') categoria = 'Aderezos';

            return { id, categoria, producto, unidad: uLow || 'unidad', precio };
        }

        function parseCSV(text) {
            const rows = []; let row = [], cur = '', q = false;
            for (let i = 0; i < text.length; i++) {
                const c = text[i];
                if (q) { if (c === '"' && text[i+1] === '"') { cur += '"'; i++; } else if (c === '"') q = false; else cur += c; }
                else if (c === '\t' || c === ',') { 
                    if (!q) { row.push(cur); cur = ''; }
                    else { cur += c; }
                }
                else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
                else if (c !== '\r') cur += c;
            }
            if (cur || row.length) { row.push(cur); rows.push(row); }
            return rows;
        }

        // Carga robusta sincronizada directamente con Google Sheets
        async function loadSheet() {
            if (!SHEET_CSV_URL) return;
            try {
                const cacheBuster = SHEET_CSV_URL + (SHEET_CSV_URL.includes('?') ? '&' : '?') + 't=' + Date.now();
                const res = await fetch(cacheBuster, { cache: "no-store" });
                if (!res.ok) throw new Error("HTTP " + res.status);
                
                const text = await res.text();
                const rows = parseCSV(text);
                if (!rows || rows.length < 2) return;

                // Normalización de encabezados sin acentos ni espacios
                const head = rows.shift().map(h => 
                    h.normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim().toLowerCase()
                );
                
                const ix = k => head.indexOf(k);
                const idxProd = ix('producto');
                const idxPrice = ix('precio');
                const idxCat = ix('categoria');
                const idxUnit = ix('unidad');
                const idxId = ix('id');

                if (idxProd === -1 || idxPrice === -1) {
                    console.warn("Faltan las columnas 'producto' o 'precio' en la hoja de cálculo.");
                    return;
                }

                const seenIds = new Set();
                const list = rows
                    .filter(r => r[idxProd] && r[idxProd].trim() !== '')
                    .map((r, n) => {
                        let rawPrice = r[idxPrice] ? r[idxPrice].toString().trim() : '0';
                        let cleanPrice = parseFloat(rawPrice.replace(/[^0-9]/g, '')) || 0;
                        
                        let id = parseInt(r[idxId]) || (1000 + n);
                        while (seenIds.has(id)) { id += 1000; }
                        seenIds.add(id);

                        return normalizeRow({
                            id: id,
                            categoria: idxCat !== -1 && r[idxCat] ? r[idxCat].trim() : 'Varios',
                            producto: r[idxProd].trim(),
                            unidad: idxUnit !== -1 && r[idxUnit] ? r[idxUnit].trim() : 'unidad',
                            precio: cleanPrice
                        });
                    });

                if (list.length > 0) { 
                    products = list; 
                    renderProducts(currentFilter, document.getElementById('searchInput').value); 
                    updateCartBar();
                    console.log("¡Precios y productos sincronizados con Google Sheets con éxito!");
                }
            } catch (e) { 
                console.warn('Conectando con respaldo integrado (si estás probando con file:// ejecutá un servidor local):', e); 
            }
        }

        function calcSubtotal(prod, entry) {
            if (!prod || prod.precio <= 0 || !entry) return 0;
            if (entry.mode === 'grams') return (prod.precio / 100) * entry.qty;
            if (entry.mode === 'unit') {
                const estWeight = entry.qty * getEstimatedUnitWeight(prod);
                return prod.precio * estWeight;
            }
            return prod.precio * entry.qty;
        }

        function formatQtyLabel(prod, qty, mode) {
            if (mode === 'grams') return `${qty}g`;
            if (mode === 'kg' || mode === 'kg_entero') return `${fmt(qty)} kg`;
            if (mode === 'unit') {
                const label = getCustomUnitLabel(prod) === 'Bifes' ? (qty === 1 ? 'bife' : 'bifes') : 'unid.';
                return `${qty} ${label}`;
            }
            return `${fmt(qty)}`;
        }

        function formatWhatsAppQty(prod, entry) {
            const { qty, mode } = entry;
            if (mode === 'grams') return `${qty}g`;
            if (mode === 'kg' || mode === 'kg_entero') return `${fmt(qty)} kg`;
            if (mode === 'unit') {
                const unitType = getCustomUnitLabel(prod) === 'Bifes' ? (qty === 1 ? 'bife' : 'bifes') : (qty === 1 ? 'unidad' : 'unidades');
                const estKg = (qty * getEstimatedUnitWeight(prod)).toFixed(2);
                return `${qty} ${unitType} (${estKg} kg est. - ${money(prod.precio)}/kg)`;
            }
            const u = prod.unidad.toLowerCase();
            if (qty === 1) return `1 ${u}`;
            if (u === 'unidad') return `${qty} unidades`;
            return `${qty} ${u}s`;
        }

        function updateCategoryButtonsUI(activeCat) {
            document.querySelectorAll('.cat-btn').forEach(b => {
                const cat = b.getAttribute('data-cat');
                if (cat === activeCat) {
                    if (cat === 'Ofertas') {
                        b.className = "cat-btn shrink-0 whitespace-nowrap text-xs font-bold px-3.5 py-2 rounded-full bg-red-600 text-white shadow-sm transition-all";
                    } else if (cat === 'Promos') {
                        b.className = "cat-btn shrink-0 whitespace-nowrap text-xs font-bold px-3.5 py-2 rounded-full bg-amber-600 text-white shadow-sm transition-all";
                    } else {
                        b.className = "cat-btn shrink-0 whitespace-nowrap text-xs font-bold px-3.5 py-2 rounded-full bg-zinc-900 text-white shadow-sm transition-all";
                    }
                } else {
                    if (cat === 'Ofertas') {
                        b.className = "cat-btn shrink-0 whitespace-nowrap text-xs font-bold px-3.5 py-2 rounded-full bg-red-50 text-red-700 border border-red-200 hover:bg-red-100 transition-all";
                    } else if (cat === 'Promos') {
                        b.className = "cat-btn shrink-0 whitespace-nowrap text-xs font-bold px-3.5 py-2 rounded-full bg-amber-50 text-amber-800 border border-amber-200 hover:bg-amber-100 transition-all";
                    } else {
                        b.className = "cat-btn shrink-0 whitespace-nowrap text-xs font-semibold px-3.5 py-2 rounded-full bg-white text-gray-700 border border-gray-200 hover:bg-gray-100 transition-all";
                    }
                }
            });
        }

        function renderProducts(filter = 'todos', search = '') {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';

            const cleanSearch = search.trim().toLowerCase();

            const filtered = products.filter(p => {
                if (cleanSearch !== '') {
                    return p.producto.toLowerCase().includes(cleanSearch) || p.categoria.toLowerCase().includes(cleanSearch);
                }
                return filter === 'todos' || p.categoria.toLowerCase() === filter.toLowerCase();
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="sm:col-span-2 text-center py-12 text-gray-400 text-sm">No se encontraron productos para "${search}".</div>`;
                return;
            }

            filtered.forEach(p => {
                const inCart = cart[p.id] !== undefined;
                const mode = inCart ? cart[p.id].mode : getMode(p);
                const defaultQty = stepOf(p);
                const qty = inCart ? cart[p.id].qty : (draftQty[p.id] || defaultQty);
                const priceText = p.precio > 0 ? money(p.precio) : 'Consultar';
                const unitDisplay = (p.unidad === 'kg_entero') ? 'kg' : p.unidad;
                
                let badgeColor = "bg-gray-100 text-gray-600";
                if (p.categoria === 'Ofertas') badgeColor = "bg-red-100 text-red-700 font-bold";
                if (p.categoria === 'Promos') badgeColor = "bg-amber-100 text-amber-800 font-bold";

                const customUnitLabel = getCustomUnitLabel(p);
                const baseKgMode = isKgWholeItem(p) ? 'kg_entero' : 'kg';
                const modeSwitchHTML = customUnitLabel ? `
                    <div class="grid grid-cols-2 bg-gray-100 p-0.5 rounded-lg mb-2.5 text-[11px] font-bold">
                        <button type="button" onclick="toggleSaleMode(${p.id}, '${baseKgMode}')" 
                            class="py-1 rounded-md transition-all ${mode !== 'unit' ? 'bg-zinc-900 text-white shadow-sm' : 'text-gray-600 hover:text-zinc-900'}">
                            Por Peso (Kg)
                        </button>
                        <button type="button" onclick="toggleSaleMode(${p.id}, 'unit')" 
                            class="py-1 rounded-md transition-all ${mode === 'unit' ? 'bg-red-600 text-white shadow-sm' : 'text-gray-600 hover:text-zinc-900'}">
                            Por ${customUnitLabel}
                        </button>
                    </div>
                ` : '';

                const selectorHTML = isGramsItem(p) ? `
                    <div class="flex items-center space-x-1">
                        <button onclick="updateQty(${p.id}, -1)" class="w-8 h-9 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg font-bold text-base flex items-center justify-center">-</button>
                        <div class="relative flex items-center">
                            <input type="number" step="50" min="50" value="${qty}" 
                                onchange="setCustomGrams(${p.id}, this.value)"
                                class="w-16 h-9 bg-gray-50 border border-gray-200 rounded-lg text-center font-bold text-xs pr-3 focus:outline-none focus:ring-1 focus:ring-red-500"
                                title="Gramos">
                            <span class="absolute right-1.5 text-[10px] text-gray-400 font-bold pointer-events-none">g</span>
                        </div>
                        <button onclick="updateQty(${p.id}, 1)" class="w-8 h-9 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg font-bold text-base flex items-center justify-center">+</button>
                    </div>
                ` : `
                    <div class="flex items-center space-x-1.5">
                        <button onclick="updateQty(${p.id}, -1)" class="w-9 h-9 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg font-bold text-base flex items-center justify-center">-</button>
                        <span id="qty-${p.id}" class="text-xs font-bold min-w-[3.4rem] px-1 text-center">${formatQtyLabel(p, qty, mode)}</span>
                        <button onclick="updateQty(${p.id}, 1)" class="w-9 h-9 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg font-bold text-base flex items-center justify-center">+</button>
                    </div>
                `;

                const card = document.createElement('div');
                card.className = `bg-white/95 backdrop-blur-sm p-4 rounded-2xl border ${inCart ? 'border-emerald-500 ring-1 ring-emerald-500' : 'border-gray-200/80'} shadow-sm flex flex-col justify-between hover:shadow-md transition-all`;
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-1">
                            <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 ${badgeColor} rounded-md">${p.categoria}</span>
                            <span class="text-xs font-bold text-red-600">${priceText} <span class="text-[10px] text-gray-400 font-normal">/ ${unitDisplay}</span></span>
                        </div>
                        <h4 class="font-bold text-gray-800 text-sm mb-2 leading-snug">${p.producto}</h4>
                        ${modeSwitchHTML}
                    </div>
                    <div class="flex items-center justify-between pt-2 border-t border-gray-100 gap-2">
                        ${selectorHTML}
                        <div class="flex items-center gap-1.5">
                            ${inCart ? `
                                <button onclick="removeFromCart(${p.id})" title="Quitar del pedido" class="bg-red-50 hover:bg-red-100 text-red-600 text-xs font-bold px-3 py-2.5 rounded-xl transition-colors">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                                <button onclick="addToCart(${p.id})" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3 py-2.5 rounded-xl transition-colors">
                                    <i class="fa-solid fa-check mr-1"></i> En pedido
                                </button>
                            ` : `
                                <button onclick="addToCart(${p.id})" class="bg-zinc-900 hover:bg-red-600 text-white text-xs font-bold px-3 py-2.5 rounded-xl transition-colors">
                                    <i class="fa-solid fa-cart-plus mr-1"></i> Agregar
                                </button>
                            `}
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function setCustomGrams(id, val) {
            const p = products.find(x => x.id === id);
            if (!p) return;
            let grams = parseInt(val, 10);
            if (isNaN(grams) || grams <= 0) {
                if (cart[id] !== undefined) removeFromCart(id);
                return;
            }
            draftQty[id] = grams;
            if (cart[id] !== undefined) {
                cart[id] = { qty: grams, mode: 'grams' };
                updateCartBar();
            }
            renderProducts(currentFilter, document.getElementById('searchInput').value);
        }

        function updateQty(id, delta) {
            const p = products.find(x => x.id === id);
            if (!p) return;
            const mode = cart[id] !== undefined ? cart[id].mode : getMode(p);
            const s = mode === 'grams' ? 100 : (mode === 'kg' ? 0.5 : 1);
            
            let current = cart[id] !== undefined ? cart[id].qty : (draftQty[id] || s);
            current = Math.round((current + delta * s) * 10) / 10;

            if (current <= 0) {
                delete draftQty[id];
                if (cart[id] !== undefined) removeFromCart(id);
                return;
            }

            draftQty[id] = current;
            if (cart[id] !== undefined) {
                cart[id] = { qty: current, mode: mode };
                updateCartBar();
            }
            renderProducts(currentFilter, document.getElementById('searchInput').value);
        }

        function addToCart(id) {
            const p = products.find(x => x.id === id);
            if (!p) return;
            const mode = getMode(p);
            const qty = draftQty[id] !== undefined ? draftQty[id] : (cart[id] !== undefined ? cart[id].qty : stepOf(p));
            cart[id] = { qty, mode };
            updateCartBar();
            renderProducts(currentFilter, document.getElementById('searchInput').value);
        }

        function removeFromCart(id) {
            delete cart[id];
            delete draftQty[id];
            updateCartBar();
            renderProducts(currentFilter, document.getElementById('searchInput').value);
            if (!document.getElementById('checkoutModal').classList.contains('hidden')) {
                renderCheckoutList();
                if (Object.keys(cart).length === 0) closeCheckout();
            }
        }

        function clearCart() {
            cart = {};
            draftQty = {};
            updateCartBar();
            renderProducts(currentFilter, document.getElementById('searchInput').value);
            closeCheckout();
        }

        function getCartTotal() {
            let total = 0;
            for (let id in cart) {
                const prod = products.find(p => p.id == parseInt(id));
                if (prod) {
                    total += calcSubtotal(prod, cart[id]);
                }
            }
            return total;
        }

        function updateCartBar() {
            const totalItems = Object.keys(cart).length;
            const cartBar = document.getElementById('cartBar');
            document.getElementById('cartCount').innerText = totalItems;
            const totalMoney = getCartTotal();
            document.getElementById('cartTotalBar').innerText = `${money(totalMoney)} (Est.)`;

            if (totalItems > 0) {
                cartBar.classList.remove('translate-y-full');
            } else {
                cartBar.classList.add('translate-y-full');
            }
        }

        function renderCheckoutList() {
            const container = document.getElementById('cartItemsList');
            container.innerHTML = '';
            for (let id in cart) {
                const prod = products.find(p => p.id == parseInt(id));
                if (!prod) continue;
                const entry = cart[id];
                const subVal = calcSubtotal(prod, entry);
                const sub = subVal > 0 ? (entry.mode === 'unit' ? `${money(subVal)}` : money(subVal)) : 'Consultar';
                const qtyText = formatWhatsAppQty(prod, entry);

                const itemDiv = document.createElement('div');
                itemDiv.className = "py-2.5 flex justify-between items-center gap-2 text-xs";
                itemDiv.innerHTML = `
                    <div class="flex-1">
                        <p class="font-bold text-gray-800">${prod.producto}</p>
                        <p class="text-gray-500">${qtyText}</p>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="font-bold text-gray-900 text-right">${sub}</span>
                        <button onclick="removeFromCart(${prod.id})" title="Eliminar ítem" class="text-red-500 hover:text-red-700 p-1.5 bg-red-50 rounded-lg">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                `;
                container.appendChild(itemDiv);
            }
            const totalMoney = getCartTotal();
            document.getElementById('modalTotal').innerText = `${money(totalMoney)}`;
        }

        function filterCategory(cat) {
            currentFilter = cat;
            const searchInput = document.getElementById('searchInput');
            if (searchInput.value.trim() !== '') {
                searchInput.value = '';
                document.getElementById('clearSearchBtn').classList.add('hidden');
            }
            updateCategoryButtonsUI(currentFilter);
            renderProducts(currentFilter, '');
        }

        function clearSearch() {
            const searchInput = document.getElementById('searchInput');
            searchInput.value = '';
            document.getElementById('clearSearchBtn').classList.add('hidden');
            updateCategoryButtonsUI(currentFilter);
            renderProducts(currentFilter, '');
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const val = e.target.value;
            const clearBtn = document.getElementById('clearSearchBtn');
            if (val.trim() !== '') {
                clearBtn.classList.remove('hidden');
                updateCategoryButtonsUI('todos');
            } else {
                clearBtn.classList.add('hidden');
                updateCategoryButtonsUI(currentFilter);
            }
            renderProducts(currentFilter, val);
        });

        function openCheckout() {
            setDeliveryMode(deliveryMode);
            renderCheckoutList();
            document.getElementById('checkoutModal').classList.remove('hidden');
            document.getElementById('checkoutModal').classList.add('flex');
        }

        function closeCheckout() {
            document.getElementById('checkoutModal').classList.remove('flex');
            document.getElementById('checkoutModal').classList.add('hidden');
        }

        function sendToWhatsApp() {
            const name = document.getElementById('clientName').value.trim();
            const address = document.getElementById('clientAddress').value.trim();
            const paymentRadio = document.querySelector('input[name="paymentOption"]:checked');
            const payment = paymentRadio ? paymentRadio.value : 'Efectivo';
            const note = document.getElementById('clientNote').value.trim();
            
            if (!name) {
                alert('Por favor ingresá tu nombre y apellido para confirmar el pedido.');
                return;
            }
            if (deliveryMode === 'delivery' && !address) {
                alert('Por favor ingresá tu dirección exacta para poder enviar el Delivery.');
                return;
            }

            let message = `*Nuevo Pedido Web - Carnes Guerra*\n\n`;
            message += `*Cliente:* ${name}\n`;
            if (deliveryMode === 'delivery') {
                message += `*Modalidad:* Envío a Domicilio (Delivery)\n`;
                message += `*Dirección:* ${address}\n`;
            } else {
                message += `*Modalidad:* Retiro en Local (${STORE_ADDRESS})\n`;
            }
            message += `*Método de Pago:* ${payment}\n`;
            if (note) message += `*Aclaración:* ${note}\n`;
            message += `----------------------------------\n`;

            let totalEst = 0;

            for (let id in cart) {
                const prod = products.find(p => p.id == parseInt(id));
                if (!prod) continue;
                const entry = cart[id];
                const subtotal = calcSubtotal(prod, entry);
                totalEst += subtotal;

                const displayQtyText = formatWhatsAppQty(prod, entry);
                message += `- *${prod.producto}* (${displayQtyText}) - ${money(subtotal)}\n`;
            }

            message += `----------------------------------\n`;
            message += `*Total Estimado:* ${money(totalEst)}\n`;

            const url = `https://wa.me/${STORE_PHONE}?text=${encodeURIComponent(message)}`;
            window.open(url, '_blank');
        }

        updateCategoryButtonsUI('todos');
        renderProducts();
        loadSheet();
    </script>
</body>
</html>
